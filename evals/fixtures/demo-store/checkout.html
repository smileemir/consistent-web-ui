<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout - Kestrel Supply</title><link rel="stylesheet" href="/css/site.css"></head>
<body>
<header class="site-header"><div class="inner container">
  <a class="logo" href="/index.html">Kestrel Supply</a>
  <nav class="nav"><a href="/products.html">Shop</a><a href="/account/orders.html">Orders</a><a href="#">Help</a></nav>
  <form class="search" action="/products.html"><input name="q" placeholder="Search products"></form>
  <button class="icon-btn" id="theme-toggle"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg></button>
  <a class="icon-btn" href="/cart.html"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 4h2l2 12h11l2-8H6" stroke="currentColor" fill="none" stroke-width="2"/></svg></a>
</div></header>
<main class="container" style="max-width:560px">
  <h1>Checkout</h1>
  <form method="post" action="/api/orders">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="field"><label for="name">Full name</label><input id="name" name="name" required></div>
    <div class="field"><label for="address">Address</label><input id="address" name="address" required><div class="error">Please enter a valid address.</div></div>
    <button class="btn-checkout" type="submit">Pay now</button>
  </form>
  <div class="modal-backdrop" id="backdrop"></div>
  <div class="modal" id="terms"><h2>Terms</h2><p>Sample terms.</p><button class="btn" onclick="closeModal()">Close</button></div>
</main>
<footer class="site-footer"><div class="container">
  <p>&copy; 2026 Kestrel Supply (fictional demo store)</p>
  <div class="payments"><div class="payments-track"><span>VISA</span><span>Mastercard</span><span>PayPal</span><span>Apple Pay</span><span>VISA</span><span>Mastercard</span><span>PayPal</span><span>Apple Pay</span></div></div>
</div></footer>
<div class="toast" id="toast" hidden>Added to cart</div>
<script src="/js/app.js"></script>
</body></html>
